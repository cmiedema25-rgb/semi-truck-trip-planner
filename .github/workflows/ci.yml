name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (offline mock)
        env:
          TRUCKPLAN_FORCE_MOCK: "1"
        run: python -m pytest -q
      - name: Evidence
        env:
          TRUCKPLAN_FORCE_MOCK: "1"
        run: python scripts/write_evidence.py
      - name: CLI smoke
        env:
          TRUCKPLAN_FORCE_MOCK: "1"
        run: |
          truckplan version
          truckplan route --to "Chicago warehouse" --from "Ontario CA terminal" --json | head -c 500
